name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # No AWS credentials needed for fmt/validate — this is a syntax and
      # schema check, not a deployment.
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Init (backend disabled)
        run: terraform init -backend=false
        working-directory: infra

      - name: Validate
        run: terraform validate
        working-directory: infra

  smoke:
    name: Dashboard import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Catches import errors, syntax errors and NameErrors in the Streamlit
      # script without needing a browser. Streamlit runs the script top-to-bottom
      # in bare mode and widgets return their defaults.
      - name: Execute dashboard in bare mode
        run: python app/dashboard.py
